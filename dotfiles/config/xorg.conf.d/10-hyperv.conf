# ============================================================
# Xorg configuration for Hyper-V synthetic display adapter
# Deployed to: /etc/X11/xorg.conf.d/10-hyperv.conf (as root)
#
# Forces the modesetting driver on the Hyper-V DRM device
# (/dev/dri/card0) and sets a sensible default resolution.
# ============================================================

Section "Device"
    Identifier  "HyperV-Video"
    Driver      "modesetting"
    Option      "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier  "HyperV-Monitor"
    # Sync ranges that work with Hyper-V virtual display
    HorizSync   28-80
    VertRefresh 40-75
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "HyperV-Video"
    Monitor     "HyperV-Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "1920x1080" "1280x720" "1024x768"
    EndSubSection
EndSection
