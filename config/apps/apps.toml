[[apps]]
# vscodium — FLOSS rebuild of Microsoft VSCode.  Same Electron app with
# the proprietary Microsoft branding, telemetry, and EULA-tied
# marketplace stripped out.  Extensions resolve from Open VSX Registry
# by default; Microsoft-proprietary ones (ms-python.*, ms-vscode-remote.*,
# github.copilot-chat) don't transfer.
#
# settings.json was extracted from the user's installed MS VSCode
# (~/.config/Code/User/settings.json) and layered with a telemetry-off /
# auto-update-off / no-walkthrough block — see _PROFILE.md.
#
# extensions.txt is the Open VSX subset of the user's extension list
# (7 of 24); see _PROFILE.md for the dropped MS-only extensions.
#
# Trust path: pinned 40-hex fingerprint (Pavlo Rudyi <paulcarroty@riseup.net>).
# Pin mode: track-latest — apt manages versions within the pinned repo.
name         = "vscodium"
display_name = "VSCodium"
tier         = 2
machines     = ["common"]
description  = "FLOSS rebuild of VSCode; no MS telemetry, Open-VSX-Registry-backed extensions."
docs_url     = "https://vscodium.com/"

[apps.install]
method = "apt-pinned-repo"

[apps.install.apt_pinned_repo]
package         = "codium"
suite_url       = "https://paulcarroty.gitlab.io/vscodium-deb-rpm-repo/debs"
suite           = "vscodium"
components      = ["main"]
key_url         = "https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg"
key_fingerprint = "1302DE60231889FE1EBACADC54678CF75A278D9C"
keyring_file    = "vscodium-keyring.gpg"
sources_file    = "vscodium.sources"

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-24"
refresh_after_days = 90

# settings.json deploys to the per-user VSCodium config dir.  overlay=true
# so a machine can layer per-host tweaks (workspace-local prefs, font
# size) on top of the privacy defaults without diverging the repo.
[apps.configs."${HOME}/.config/VSCodium/User/settings.json"]
source  = "settings.json"
mode    = "0644"
overlay = true

# Install the Open VSX extension set after VSCodium itself lands.
# Reads extensions.txt (one extension id per line, '#' for comments,
# blank lines OK) and calls `codium --install-extension` for each.
# Idempotent — VSCodium skips already-installed extensions.
[[apps.hooks.post_install]]
description = "install Open VSX extensions listed in extensions.txt"
command     = "while IFS= read -r ext; do [[ -z \"${ext}\" || \"${ext}\" == \\#* ]] && continue; codium --install-extension \"${ext}\" --force; done < {app_dir}/extensions.txt"


