docs_url     = "https://mosh.org/"

[apps.install]
method = "apt"

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-23"
refresh_after_days = 90

[[apps]]
# pass — the original Unix password manager.  Flat ~/.password-store/
# tree of gpg-encrypted files, one secret per file.  Pairs with git for
# sync (the user-driven `pass git push` flow, not auto-sync).
#
# This entry also deploys hardened gpg.conf + gpg-agent.conf — pass's
# entire security posture is the underlying GnuPG config, so hardening
# happens THERE rather than via a passrc that doesn't exist.  Both files
# are overlay=false (intentional — we want every machine running the
# same crypto policy); see config/apps/pass/_PROFILE.md for the rationale
# and per-key explanations.
#
# Trust path: stock Debian apt.
#
# Pin mode: track-latest.
name         = "pass"
display_name = "pass (password-store)"
tier         = 1
machines     = ["common"]
description  = "gpg-backed password store; pairs with git for sync."
docs_url     = "https://www.passwordstore.org/"

[apps.install]
method = "apt"

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-23"
refresh_after_days = 90

[apps.configs]
# overlay=false — uniform crypto policy across every machine.  Mode 0600
# matches GnuPG's own expectation for ~/.gnupg/* (the agent will warn or
# refuse on world-readable config in some versions).
"${HOME}/.gnupg/gpg.conf"       = { source = "gpg.conf",       mode = "0600", overlay = false }
"${HOME}/.gnupg/gpg-agent.conf" = { source = "gpg-agent.conf", mode = "0600", overlay = false }

[[apps]]
# rage — Rust implementation of the age spec.  Same wire format as age
# (entries are interchangeable); better Linux integration (proper
# pinentry support for passphrase-protected identities, native stdout/
# stderr conventions).  Ships side-by-side with age so the user can pick
# whichever they have muscle memory for.
#
# Trust path: stock Debian apt.  Upstream cargo / GitHub release is GPG-
# signed (str4d), but Debian main is sufficient at this tier.
#
# Pin mode: track-latest.
name         = "rage"
display_name = "rage (Rust age)"
tier         = 1
machines     = ["common"]
description  = "Rust implementation of age; same wire format, better Linux integration."
docs_url     = "https://github.com/str4d/rage"

# Upstream ships `rage-musl_X.Y.Z-1_amd64.deb`; the .deb's `Package:`
# field is `rage-musl` (statically linked against musl).  The
# user-facing app name stays `rage` (meta.name); install.package
# tells the dpkg short-circuit + remove path which package to query.
[apps.install]
method  = "direct-deb"
package = "rage-musl"

[apps.install.direct_deb]
url     = "https://github.com/str4d/rage/releases/download/v0.11.2/rage-musl_0.11.2-1_amd64.deb"
sha256  = "6cb7f11483dd516af11f556090a5228a6fe8853c25633de21096eeff486c1a88"
version = "0.11.2"

# Trust path: direct-deb from upstream GitHub Releases.  rage is NOT
# packaged in Debian trixie (rage-musl exists in sid/experimental but
# not stable).  The release IS GPG-signed by str4d but the .deb is
# only sha-anchored in the manifest; HTTPS + sha256 is the trust chain.
# Pin mode: frozen — direct-deb is frozen-only by contract.
[apps.pin]
mode               = "frozen"
last_refreshed     = "2026-05-24"
refresh_after_days = 90

