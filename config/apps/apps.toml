# Three SYSTEM-path config files.  All require sudo to deploy.
#
# DEPLOY-PATH CAVEAT: Mozilla's autoconfig.js MUST live under the
# application's `defaults/pref/` directory to be processed by the
# AutoConfig handler — otherwise the `general.config.filename` +
# `general.config.obscure_value` prefs are set as user prefs and never
# trigger the .cfg load (every `lockPref` becomes a no-op).  See Phase C
# review #6.  After first install, run:
#   dpkg -L thunderbird | grep -E 'defaults/pref|autoconfig'
# to confirm the correct path on your Debian release.  Trixie's
# thunderbird package ships defaults/pref under /usr/lib/thunderbird/.
[apps.configs."/etc/thunderbird/policies/policies.json"]
source  = "policies.json"
mode    = "0644"
overlay = false

[apps.configs."/usr/lib/thunderbird/defaults/pref/autoconfig.js"]
source  = "autoconfig.js"
mode    = "0644"
overlay = false

[apps.configs."/usr/lib/thunderbird/lock-thunderbird.cfg"]
source  = "lock-thunderbird.cfg"
mode    = "0644"
overlay = false


