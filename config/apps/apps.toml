[[apps]]
# JetBrainsMono Nerd Font — installed today by
# local_setup.sh:install_nerd_font (~L2394-2457), which downloads
# JetBrainsMono.zip from ryanoasis/nerd-fonts v3.3.0, fetches the
# SHA-256.txt manifest, verifies via `sha256sum -c`, and extracts the
# *NerdFont*.ttf files to ~/.local/share/fonts/NerdFonts/ before
# running `fc-cache -f`.
#
# This manifest is a descriptor only in Phase A; local_setup.sh keeps
# running unchanged.  Schema choices preserved from Phase 0:
#   • asset_pattern = "JetBrainsMono.zip" — the font archive is
#     architecture-independent (TTF files), so no {arch} substitution.
#     We mirror legacy code's choice of the .zip variant (NOT .tar.xz).
#   • install_to is the system-wide fontconfig path; the legacy path
#     under ~/.local/share/fonts/NerdFonts is equally valid for
#     fontconfig and a future adapter may override.
#   • extract_path = "" — the github-release adapter unpacks the whole
#     tree (no single binary to pull from a nested path).
#   • Nerd Fonts releases are NOT GPG-signed; sidecar SHA-256 is the
#     only tamper signal.
#
# Pin mode: frozen — v3.3.0 sha pulled from upstream SHA-256.txt on
# 2026-05-19 (matches what install_nerd_font would verify on a fresh
# run today).  Fonts rarely bump; verify-pins.sh flags staleness only
# if upstream cuts a new release between manual refreshes.
name         = "jetbrains-mono-nerd"
display_name = "JetBrainsMono Nerd Font"
tier         = 2
machines     = ["common"]
description  = "Nerd-Font-patched JetBrainsMono — supplies PUA glyphs used by i3 / polybar / alacritty / rofi for icon rendering."
docs_url     = "https://github.com/ryanoasis/nerd-fonts"

[apps.install]
method = "github-release"

[apps.install.github_release]
repo            = "ryanoasis/nerd-fonts"
asset_pattern   = "JetBrainsMono.zip"
install_to      = "/usr/local/share/fonts/JetBrainsMono"
version         = "v3.3.0"
sha256_x86_64   = "2d83782a350b604bfa70fce880604a41a7f77c3eec8f922f9cdc3c20952ddbe4"
# Same archive on every architecture — populate both so verify-pins
# doesn't flag arm64 as missing.
sha256_aarch64  = "2d83782a350b604bfa70fce880604a41a7f77c3eec8f922f9cdc3c20952ddbe4"
gpg_fingerprint = ""
extract_path    = ""

[apps.pin]
mode               = "frozen"
last_refreshed     = "2026-05-19"
refresh_after_days = 90

[[apps]]
# Starship prompt — currently installed by three legacy paths, none of
# which Phase A modifies:
#   1. scripts/build-bundle.sh:174-195 — online refresh; downloads
#      starship-${arch}-unknown-linux-gnu.tar.gz + .sha256 sidecar and
#      drops both into bundle/starship/ for offline install.
#   2. scripts/install-shell.sh:~290-300 — offline-bundle install;
#      re-verifies the bundled tarball against its sha256 sidecar.
#   3. scripts/lib/install-common.sh:118-148 (common_install_starship)
#      — fallback `curl … | sh -s -- --yes` against starship.rs/install.sh
#      when no apt/dnf package is available.
#
# This manifest is a descriptor only in Phase A.  Values pulled from:
#   • build-bundle.sh's asset-name template (lines 176-181)
#   • Upstream release v1.25.1 (github.com/starship/starship/releases/tag/v1.25.1)
#   • Sidecar .sha256 files on the GitHub release CDN
#
# Caveats:
#   • Upstream does NOT publish starship-aarch64-unknown-linux-gnu.tar.gz
#     (only the musl variant).  build-bundle.sh references the gnu name
#     verbatim for aarch64 and would 404 on an arm64 build box; we
#     capture the gnu pattern here to mirror the legacy contract.
#     Adapters wanting real arm64 support should swap asset_pattern to
#     `…-unknown-linux-musl.tar.gz`.
#   • Starship does NOT GPG-sign releases — sidecar SHA-256 is the
#     only tamper signal.  Leave gpg_fingerprint = "".
#
# Pin mode: frozen — v1.25.1 + sha256_x86_64 verified 2026-05-19.
# sha256_aarch64 is the empty string by design (see caveat).
name         = "starship"
display_name = "Starship prompt"
tier         = 2
machines     = ["common"]
description  = "Cross-shell prompt; replaces the default zsh PS1 with a fast Rust prompt."
docs_url     = "https://starship.rs/"

[apps.install]
method = "github-release"

[apps.install.github_release]
repo            = "starship/starship"
# {arch} → "x86_64" / "aarch64" (no {version} substitution — version
# lives below).  Mirror of the legacy build-bundle.sh template.
asset_pattern   = "starship-{arch}-unknown-linux-gnu.tar.gz"
install_to      = "/usr/local/bin/starship"
version         = "v1.25.1"
sha256_x86_64   = "4488c11ca632327d1f1f16fb2f102c0646094c35479cd5435991385da43c61ac"
# Empty — the gnu asset doesn't exist for aarch64 (see caveat above).
sha256_aarch64  = ""
gpg_fingerprint = ""
# Tarball is flat — the binary sits at the root with no version-named
# subdirectory.
extract_path    = "starship"

[apps.pin]
mode               = "frozen"
last_refreshed     = "2026-05-19"
refresh_after_days = 30


[[apps]]
# obsidian — Markdown notes / knowledge-graph editor.  Stores vaults as
# plain folders of `.md` files (no proprietary format), so Syncthing
# the vault path syncs notes between machines transparently.  Backlinks
# + graph view + Dataview make it strong for research workflows.
#
# Distributed as AppImage on GitHub at obsidianmd/obsidian-releases.
# Released asset name uses the bare version (`Obsidian-1.12.7.AppImage`)
# while the tag is `v1.12.7` — the {version_no_v} placeholder strips
# the leading v.
#
# Proprietary (closed-source binary) — included despite the previous
# FLOSS lean because:
#   • Storage format is open (plain .md files), so no lock-in.
#   • Built-in Restricted Mode blocks third-party plugins by default;
#     enable only the ones you audit.
#   • Per-vault config — no SYSTEM-path deploy needed; the
#     config/apps/obsidian/recommended-vault-template/ folder ships an
#     opinionated .obsidian/ that the user copies into a fresh vault.
#
# SUPPLY-CHAIN NOTE: Obsidian does NOT GPG-sign its releases.  In
# track-latest mode the only integrity check is HTTPS-to-GitHub, which
# a malicious GitHub-account compromise of obsidianmd could defeat
# silently.  Recommended workflow:
#   1. Install once with track-latest.
#   2. `./scripts/apps-cli.sh freeze --app obsidian` to lock the install
#      to the verified version + sha.
#   3. Run `apps refresh --app obsidian` quarterly and review the diff
#      before re-freezing.
# Trust path: HTTPS to GitHub Releases (no signature) + manifest pin
# (when frozen).
name         = "obsidian"
display_name = "Obsidian (markdown knowledge graph)"
tier         = 4
machines     = ["common"]
description  = "Markdown knowledge-graph editor; plain-file vaults pair cleanly with Syncthing for cross-machine sync."
docs_url     = "https://obsidian.md/"

[apps.install]
method = "github-release"

[apps.install.github_release]
repo            = "obsidianmd/obsidian-releases"
# Asset names use the bare version (no `v` prefix) while tags use `v`;
# {version_no_v} strips it.  Live example for v1.12.7:
#   Obsidian-1.12.7.AppImage
asset_pattern   = "Obsidian-{version_no_v}.AppImage"
install_to      = "/usr/local/bin/obsidian.AppImage"
gpg_fingerprint = ""
extract_path    = ""

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-24"
refresh_after_days = 90

# Post-install: drop a `obsidian` shim so the user can run the editor
# without typing the .AppImage suffix (matches the launcher names in
# kde-launcher / rofi). Mirrors the post_install pattern used by
# vscodium / code for extension-loader scripts.
[[apps.hooks.post_install]]
description = "symlink /usr/local/bin/obsidian → obsidian.AppImage + chmod +x AppImage"
command     = "sudo chmod +x /usr/local/bin/obsidian.AppImage && sudo ln -sf /usr/local/bin/obsidian.AppImage /usr/local/bin/obsidian"
