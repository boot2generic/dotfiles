[[apps]]
# Mullvad VPN — installed today by local_setup.sh:install_mullvad
# (~L967-1053), which fetches https://repository.mullvad.net/deb/mullvad-keyring.asc,
# enforces the pinned key fingerprint, writes a legacy one-line
# /etc/apt/sources.list.d/mullvad.list, and runs `apt-get install mullvad-vpn`.
#
# This manifest is currently a descriptor only — local_setup.sh keeps
# running unchanged in Phase A.  A future apt-pinned-repo adapter will
# consume this entry and deploy the deb822-format .sources file shipped
# at config/system/etc/apt/sources.list.d/mullvad.sources alongside the
# tracked keyring blob at config/system/etc/apt/keyrings/mullvad-keyring.asc.
#
# Source of truth for key rotations:
#   https://mullvad.net/en/help/install-mullvad-app-linux
#
# Pin mode: track-latest — apt manages versions via standard upgrades
# once the source list is registered.  last_refreshed is preserved from
# the Phase 0 migration as a "we last audited the key + repo" record.
name         = "mullvad-vpn"
display_name = "Mullvad VPN"
tier         = 1
machines     = ["common"]
description  = "WireGuard/OpenVPN client + daemon from Mullvad's official apt repo (kept current via the standard apt upgrade flow once the source list is registered)."
docs_url     = "https://mullvad.net/en/help/install-mullvad-app-linux"

[apps.install]
method = "apt-pinned-repo"

[apps.install.apt_pinned_repo]
package         = "mullvad-vpn"
suite_url       = "https://repository.mullvad.net/deb/stable"
# $(distro_codename) → substituted with `lsb_release -cs` at install time
# so one manifest serves trixie / bookworm / future Debian releases.
suite           = "$(distro_codename)"
components      = ["main"]
key_url         = "https://repository.mullvad.net/deb/mullvad-keyring.asc"
# Must stay in lockstep with MULLVAD_KEY_FINGERPRINT in local_setup.sh:964
# until the dispatcher takes over the install.  Bump both in the same commit.
key_fingerprint = "A1198702FC3E0A09A9AE5B75D5A1D4F266DE8DDF"
keyring_file    = "mullvad-keyring.asc"
sources_file    = "mullvad.sources"

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-19"
refresh_after_days = 90

[[apps]]
# Signal Desktop — Electron client for the Signal E2EE messenger.
#
# Trust path: Signal's official apt repo, pinned to the "xenial" suite.
# That's not a typo — Signal publishes a single apt suite that they
# label "xenial" across every distro they support, with no per-distro
# split.  The deb822 sources file shipped at
# config/system/etc/apt/sources.list.d/signal-desktop.sources reflects
# that pin verbatim.
#
# Key fingerprint (DBA36B5181D0C816F630E889D980A17457F6FB06) lifted from
# https://signal.org/download/ and cross-checked against the keys.asc
# served at the repo root.  The tracked keyring at
# config/system/etc/apt/keyrings/signal-desktop-keyring.asc is a Phase C
# placeholder; the apt-pinned-repo adapter fetches the live key and
# refuses on fingerprint mismatch.
#
# The deployed config.json disables hardware acceleration (avoids
# Mesa/Nvidia driver glitches), disables the Chromium spellchecker (its
# language packs download from a Google CDN), and forces all voice/video
# calls through Signal's TURN relays (alwaysRelayCalls — hides the
# user's IP from the call peer).  See config/apps/signal-desktop/_PROFILE.md
# for the per-key rationale.
#
# Pin mode: track-latest — apt manages versions; last_refreshed = today.
name         = "signal-desktop"
display_name = "Signal Desktop"
tier         = 1
machines     = ["common"]
description  = "E2EE messenger desktop client; pinned to Signal Foundation's signed apt repo."
docs_url     = "https://signal.org/download/"

[apps.install]
method = "apt-pinned-repo"

[apps.install.apt_pinned_repo]
package         = "signal-desktop"
suite_url       = "https://updates.signal.org/desktop/apt"
# Signal pins to the "xenial" suite across distros — that's intentional,
# NOT a typo.  Signal's apt publisher doesn't track Debian codenames; the
# single suite serves every release they support.
suite           = "xenial"
components      = ["main"]
key_url         = "https://updates.signal.org/desktop/apt/keys.asc"
# Lifted from https://signal.org/download/ on 2026-05-23.  The repo's
# keys.asc must match this fingerprint or the adapter refuses to install.
key_fingerprint = "DBA36B5181D0C816F630E889D980A17457F6FB06"
keyring_file    = "signal-desktop-keyring.asc"
sources_file    = "signal-desktop.sources"

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-23"
refresh_after_days = 90

[apps.configs]
# overlay=true so a machine can layer per-machine prefs (theme, tray
# behaviour, etc.) on top of the privacy defaults.
# Mode 0600 — Signal Desktop persists its SQLCipher database key into
# this same config.json after first launch.  World-readable would let
# any local process running as another uid (or a user-scope package
# under ~/.local) read the key off disk.  See Phase C security review.
"${HOME}/.config/Signal/config.json" = { source = "config.json", mode = "0600", overlay = true }


