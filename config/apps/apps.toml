# config/apps/apps.toml — single-file manifest of every third-party app
# installed by this dotfiles repo.
#
# Schema version 2 (array-of-tables layout).  See:
#   • config/apps/schema.toml          — field-by-field reference
#   • config/apps/schema.example.toml  — worked examples covering every
#                                        method + pin mode
#   • config/apps/README.md            — workflow + lifecycle commands
#
# Ordering convention:
#   Primary sort:  install.method group (apt → apt-pinned-repo →
#                  github-release → direct-deb).
#   Secondary:     alphabetical by `name` within each group.
# Section header comments delimit groups.
#
# Pin modes:
#   "track-latest" — apt (or other upstream channel) manages the version;
#                    the manifest is metadata + last_refreshed annotation.
#   "frozen"       — manifest carries the version + sha256.  Installer
#                    refuses on hash mismatch.  REQUIRED for direct-deb;
#                    recommended for github-release.
#
# Lockfile sidecars live at config/apps/.locks/<name>.lock — see README.md.

schema_version = 2

# ============================================================
# method = "apt"
# ============================================================

[[apps]]
# age — modern file encryption tool (X25519 + ChaCha20-Poly1305 + HKDF).
# Designed as a simpler, foot-gun-free alternative to gpg for ad-hoc
# encrypt/decrypt — no web of trust, no key servers, no metadata leakage
# in armored output.  Pairs with the rage entry below (same wire format).
#
# Trust path: stock Debian apt — Debian release key signs the package
# index.  No extra repo to pin; no extra fingerprint to manage.
#
# Pin mode: track-latest — apt manages the version via standard upgrades.
# last_refreshed acts as the "we last looked at this" annotation.
name         = "age"
display_name = "age (file encryption)"
tier         = 1
machines     = ["common"]
description  = "Modern file encryption (X25519 + ChaCha20-Poly1305); simpler than gpg for ad-hoc encrypt/decrypt."
docs_url     = "https://age-encryption.org/"

[apps.install]
method = "apt"

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-23"
refresh_after_days = 90

[[apps]]
# gopass — Go reimplementation of pass.  Reads the same on-disk layout
# (gpg-encrypted text files under ~/.password-store/) so it interoperates
# with a pass-managed store.  Adds first-class git, team sharing, and
# JSON output for scripting.
#
# Trust path: direct-deb from upstream GitHub Releases over HTTPS,
# SHA-256-pinned in the manifest.  gopass is NOT packaged in Debian
# trixie (removed in transition from bookworm; upstream redirects users
# to their GitHub releases — see https://www.gopass.pw/#installation).
# Upstream signs releases with their cosign key but the .deb itself is
# only sha-anchored; trust comes from the manifest pin + HTTPS chain.
#
# Pin mode: frozen — direct-deb is frozen-only by contract.  Refresh
# quarterly with `./scripts/apps-cli.sh refresh --app gopass` which
# HEADs the pinned URL; when upstream cuts a new release, update the
# url + sha256 + version below, then commit.
name         = "gopass"
display_name = "gopass (password manager)"
tier         = 1
machines     = ["common"]
description  = "gpg-backed password manager; team-friendly extension of pass."
docs_url     = "https://www.gopass.pw/"

[apps.install]
method = "direct-deb"

[apps.install.direct_deb]
url     = "https://github.com/gopasspw/gopass/releases/download/v1.16.1/gopass_1.16.1_linux_amd64.deb"
sha256  = "c96b0e10813598799f2154f22456501ec190f45eaa7fead7beba21f17993a514"
version = "1.16.1"

[apps.pin]
mode               = "frozen"
last_refreshed     = "2026-05-24"
refresh_after_days = 90

[[apps]]
# KeePassXC — local-only password database (.kdbx).  No cloud sync, no
# network calls in the default config.  Pairs with the KeePassXC-Browser
# WebExtension for autofill (we ship that integration OFF by default; flip
# it on per-machine via the overlay).
#
# The deployed keepassxc.ini hardens the privacy posture (5-minute idle
# auto-lock, lock-on-minimize, lock-on-session-lock, clipboard wipe,
# updater off).  Argon2id KDF parameters live INSIDE each .kdbx file —
# pick them at database-creation time; see _PROFILE.md for the recipe.
#
# Trust path: stock Debian apt.  Upstream signs releases with key
# `BF5A669F2272CF4324EDFB64A1FEDD1ED0C7AA0D` but we let Debian's release
# key be the trust root since we're consuming the .deb from main, not
# upstream's apt repo.
#
# Pin mode: track-latest.
name         = "keepassxc"
display_name = "KeePassXC"
tier         = 1
machines     = ["common"]
description  = "Local-only password database; pairs with the KeePassXC-Browser extension for autofill."
docs_url     = "https://keepassxc.org/"

[apps.install]
method = "apt"

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-23"
refresh_after_days = 90

[apps.configs]
# overlay=true so a machine that DOES use the browser extension can flip
# Browser/Enabled=true via ~/.config/dotfiles-local/keepassxc/keepassxc.ini
# without diverging the repo copy.  Mode 0600 — the ini stores no secrets
# itself but its referenced paths leak which databases exist.
"${HOME}/.config/keepassxc/keepassxc.ini" = { source = "keepassxc.ini", mode = "0600", overlay = true }

[[apps]]
# libpam-yubico — PAM module that lets a YubiKey gate `login`, `sudo`,
# `lightdm`, etc.  Installing the package does NOT enable PAM integration
# — /etc/pam.d/ stays untouched.  The opt-in switch lives in the
# `harden --yubikey` flow (see scripts/lib/harden.sh, future).  We ship
# the package here so the binary's available when the user opts in; the
# package itself is harmless idle.
#
# Trust path: stock Debian apt.  Upstream is Yubico's yubico-pam project;
# their signed apt PPA exists but Debian main's libpam-yubico is current
# enough that an extra pinned repo would be pure overhead.
#
# Pin mode: track-latest.
name         = "libpam-yubico"
display_name = "PAM YubiKey module"
tier         = 1
machines     = ["common"]
description  = "PAM module for YubiKey auth. Opt-in only — installation does not enable PAM integration."
docs_url     = "https://developers.yubico.com/yubico-pam/"

[apps.install]
method = "apt"

[apps.pin]
mode               = "track-latest"
last_refreshed     = "2026-05-23"
refresh_after_days = 90

