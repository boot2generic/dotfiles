mode    = "0644"
overlay = false

[[apps.hooks.pre_install]]
description = "regenerate mullvad-browser policies.json from base + browser_extensions"
command     = "{app_dir}/../../../scripts/lib/browser-policies-gen.py --app mullvad-browser --root {app_dir}/../../.."

