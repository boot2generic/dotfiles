refresh_after_days = 90

# Same policies-gen hook as firefox-esr but smaller extension set
# (uBlock + KeePassXC only) to preserve Mullvad's anonymity-set.
#
# DEPLOY-PATH CAVEAT: Mullvad Browser is a portable bundle that reads
# policies from <install_dir>/distribution/policies.json.  Debian's
# mullvad-browser package installs to /usr/lib/mullvad-browser/, so the
# correct system path is /usr/lib/mullvad-browser/distribution/.
# Verify after first install with `dpkg -L mullvad-browser | grep
# distribution`; adjust this dest if upstream changes the layout.
# /etc/mullvad-browser/ is an attempt at a Debian convention but Mullvad
# Browser does NOT consult /etc/ for policies — see Phase C review #5.
[apps.configs."/usr/lib/mullvad-browser/distribution/policies.json"]
