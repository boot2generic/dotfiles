# default — locks update checks, telemetry, and the onboarding banner.
# DOES NOT add the privacy add-ons that Firefox ESR gets: Mullvad
# Browser's anonymity-set depends on every installed instance looking
# identical, so we only force-install uBlock Origin + KeePassXC-Browser
# (which Mullvad does NOT ship by default).
#
# Trust path: pinned 40-hex fingerprint, vendor apt repo.  Same key as
# mullvad-vpn — see comment block on mullvad-vpn above.
