// First line is ignored by Thunderbird's autoconfig loader — leave blank.
// All subsequent lockPref/pref calls are applied at session start.

// Remote content / tracking pixels
lockPref("mailnews.message_display.disable_remote_image", true);
lockPref("mailnews.start_page.enabled", false);

// User-Agent leakage in outgoing mail
lockPref("mailnews.headers.showUserAgent", false);
lockPref("mailnews.headers.showOrganization", false);

// Cookie posture: first-party only
lockPref("network.cookie.cookieBehavior", 1);

// Network probes that betray online status
lockPref("network.connectivity-service.enabled", false);
lockPref("network.captive-portal-service.enabled", false);
lockPref("network.dns.disablePrefetch", true);

// Telemetry + health-report uploads
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);

// In-app updates (apt manages this)
lockPref("app.update.enabled", false);
lockPref("app.update.auto", false);

// Search suggestions network round-trips
lockPref("browser.search.suggest.enabled", false);

// WebRTC / WebGL — rarely needed in mail, larger fingerprinting surface
lockPref("media.peerconnection.enabled", false);
lockPref("webgl.disabled", true);
