# config/apps/starship.toml
#
# Phase 0 migration intent
# ------------------------
# Starship is currently installed by THREE existing code paths, none of
# which Phase 0 modifies:
#   1. scripts/build-bundle.sh:174-195
#      Online refresh path.  Downloads the upstream release tarball
#      `starship-${arch}-unknown-linux-gnu.tar.gz` + its `.sha256`
#      sidecar, verifies in place, drops both into bundle/starship/ for
#      offline install.  Uses `releases/latest/download/…` URLs — NOT
#      pinned to a version tag.
#   2. scripts/install-shell.sh:~290-300
#      Offline-bundle install path.  Re-verifies the bundled
#      starship.tar.gz against its sha256 sidecar before extracting.
#   3. scripts/lib/install-common.sh:118-148  (common_install_starship)
#      Falls back to `curl … | sh -s -- --yes` against starship.rs/install.sh
#      when no apt/dnf package is available.  Distinct codepath; no
#      sha pinning of its own.
#
# This TOML is a DESCRIPTOR ONLY in Phase 0.  scripts/install-apps.sh
# (Agent A/B) parses it; the github-release adapter (Agent B) would in a
# later phase replace path #1 above.  Until then the legacy paths run
# unchanged and the values here are the source of truth for
# verify-pins.sh.
#
# Values pulled from:
#   • build-bundle.sh's asset-name template (lines 176-181)
#   • Upstream release v1.25.1 (https://github.com/starship/starship/releases/tag/v1.25.1)
#   • Sidecar .sha256 files on the GitHub release CDN
#
# Caveats
# -------
# • Upstream does NOT publish a starship-aarch64-unknown-linux-gnu.tar.gz
#   (only the musl variant).  The existing build-bundle.sh references
#   the gnu name verbatim for aarch64 and would 404 on an arm64 build
#   box; we capture the gnu pattern here to mirror the legacy code's
#   contract.  Adapter implementations that want real arm64 support
#   should swap the asset_pattern to `…-unknown-linux-musl.tar.gz`.
# • starship does NOT GPG-sign releases — sidecar SHA-256 is the only
#   tamper signal upstream provides.  Leave gpg_fingerprint = "".

[meta]
name         = "starship"
display_name = "Starship prompt"
machines     = ["common"]
description  = "Cross-shell prompt; replaces the default zsh PS1 with a fast Rust prompt."
docs_url     = "https://starship.rs/"

[install]
method = "github-release"

[install.github_release]
repo            = "starship/starship"
# The legacy code derives the asset name from `uname -m`; we encode the
# same `{arch}` placeholder so the adapter substitutes "x86_64" / "aarch64".
asset_pattern   = "starship-{arch}-unknown-linux-gnu.tar.gz"
version         = "v1.25.1"
install_to      = "/usr/local/bin/starship"
# sha256 values fetched from the upstream `.sha256` sidecars on
# 2026-05-19; identical to what build-bundle.sh would verify after a
# `--refresh-starship` run on v1.25.1.
sha256_x86_64   = "4488c11ca632327d1f1f16fb2f102c0646094c35479cd5435991385da43c61ac"
# Empty — the gnu asset doesn't exist for aarch64 (see caveat above).
sha256_aarch64  = ""
# starship doesn't sign releases; sidecar SHA-256 is the only pin.
gpg_fingerprint = ""
# Path inside the tarball to the binary.  Upstream tarballs are flat —
# the binary is at the root with no version-named subdirectory.
extract_path    = "starship"

[pin]
last_refreshed     = "2026-05-19"
refresh_after_days = 30
