# GPG configuration — hardened defaults for pass / gopass workflows.
#
# Deployed by the apps-deploy pipeline to ${HOME}/.gnupg/gpg.conf (mode 0600,
# overlay=false — we want every machine running the same crypto policy).
#
# Source: Riseup OpenPGP Best Practices
#   https://riseup.net/en/security/message-security/openpgp/best-practices
# With small adjustments for current modern GnuPG (2.4.x) defaults.

# ── Algorithm preferences ───────────────────────────────────────────────
# Strong cipher / digest preference lists.  Order is significant — first
# entry that both peers support wins.  AES256 and SHA512 lead.
cert-digest-algo SHA512
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed

# Refuse to use 3DES even if a peer's preference list includes it.
disable-cipher-algo 3DES
# Refuse SHA-1 — broken since 2017, still appears in legacy keys.
weak-digest SHA1

# ── String-to-key (passphrase) hardening ────────────────────────────────
# When GnuPG turns the user's passphrase into the secret-key encryption
# key, use SHA512 + AES256 with a high iteration count.  Slows brute force
# against a stolen ~/.gnupg/private-keys-v1.d/.
s2k-digest-algo SHA512
s2k-cipher-algo AES256
s2k-count 65011712

# ── Display / identification ────────────────────────────────────────────
# Long key-IDs (16 hex) — short IDs are colliding-target trivial.
keyid-format 0xlong
with-fingerprint
list-options show-uid-validity
verify-options show-uid-validity

# ── Output sanitisation ─────────────────────────────────────────────────
# Don't leak the GnuPG version or any auto-generated comments in armored
# output.  Tiny privacy win — strips a fingerprintable line from every
# signature you produce.
no-emit-version
no-comments

# ── Keyserver ───────────────────────────────────────────────────────────
# keys.openpgp.org is the modern, validating, abuse-resistant keyserver.
# Older SKS pool is permanently dead.  hkps:// is mandatory.
keyserver hkps://keys.openpgp.org
# Don't follow a key packet's embedded preferred-keyserver URL — that's an
# active fingerprinting / dial-home vector against the recipient.
keyserver-options no-honor-keyserver-url
