# gpg-agent — passphrase cache + pinentry policy.
#
# Deployed to ${HOME}/.gnupg/gpg-agent.conf (mode 0600, overlay=false).
# Pairs with gpg.conf in the same directory.

# Cache an unlocked key for 10 minutes after last use; refuse to extend
# past 2 hours regardless of activity.  Strikes the same balance as
# KeePassXC: long enough for a multi-step git commit / pass insert flow,
# short enough that walking away for lunch invalidates the cache.
default-cache-ttl 600
max-cache-ttl 7200

# Pinentry program — Debian's /usr/bin/pinentry is a dispatcher symlink
# managed by update-alternatives; it picks the best available frontend
# per the current session (curses on TTY, gtk2/qt5/gnome3 in a GUI).  Use
# it directly so we get the right UI without hard-coding gnome3 / qt5.
pinentry-program /usr/bin/pinentry
