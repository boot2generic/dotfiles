; config/apps/flameshot/flameshot.ini — i3 screenshot tool baseline.
;
; Local-save defaults; no cloud upload (Imgur / S3 / etc.); no
; update-check phone-home.

[General]
disabledTrayIcon=false
showHelp=true
showSidePanelButton=true
showDesktopNotification=true
; Suppress the "Flameshot started — find me in the tray" banner that
; pops every session.  We've been running flameshot for years, we get it.
showStartupLaunchMessage=false
; Hard-off update checks.  apt is the source of truth for the version.
checkForUpdates=false
; Auto-save to ~/Pictures by default; the file picker only opens when
; the user explicitly hits Ctrl+S.
saveAfterCopy=true
saveAsFileExtension=png
; Save path defaults to ~/Pictures.  Flameshot expands $HOME at runtime.
savePath=
; Don't keep recent paths — minor privacy improvement.
savePathFixed=true
; Off-by-default annotation tools that look slick but invoke OCR /
; cloud features; force the simple set.
allowMultipleGuiInstances=false
useGrimAdapter=false

[Shortcuts]
; Leave the upstream defaults — i3 binds the global shortcut itself,
; so flameshot's in-app keys are just convenience.

[Updates]
; Explicit second-line defence in case `General.checkForUpdates` is
; ignored on some build.
updatesCheckEnabled=false
