; config/apps/copyq/copyq.conf — clipboard manager baseline.
;
; CopyQ stores ALL clipboard content in plaintext under
; ~/.config/copyq/ by default, so even passwords pasted through the
; clipboard land in this file's sibling DB.  This profile narrows that
; risk: tiny history, no clipboard capture from password-manager /
; pinentry windows, mode 0600 on the config itself.
;
; CopyQ's INI keys are documented at https://hluk.github.io/CopyQ/ —
; some platform-specific keys live under [General] rather than their
; own section.  When in doubt, search the upstream source for the key
; name (the names in this file are stable across recent releases).

[General]
; Hard cap on clipboard history.  Default upstream is 200; we leave it
; there because larger ringbuffers age tokens out more slowly.
maxitems=200
; Re-edit history items with Ctrl+Return so accidental Enter doesn't
; clobber the clipboard.
edit_ctrl_return=true
; Don't auto-move-to-top on selection — keeps the order stable so muscle
; memory works after a few hours of use.
move=false
; Tray icon stays visible so the user has a one-glance "history is
; recording" signal.  Hiding the tray is a footgun.
disable_tray=false
; Open the clipboard dialog only on the configured global shortcut.
; Suppresses the "first-run welcome / what's new" overlay.
hide_main_window_in_taskbar=true

[History]
; ignored_window_titles: copyq ignores clipboard CHANGES originated from
; any window whose title matches one of these substrings.  Keepassxc
; auto-clears its clipboard after 10s; we still filter it here so the
; pre-clear value never makes it into copyq's history.
;
; pinentry: GPG / SSH agent passphrase prompts.  Should never leave any
; trace in the clipboard.
;
; "Sign in", "Sign Up": catch-all for browser auth modals which often
; auto-fill a one-time-password into the clipboard for "copy & paste".
;
; IMPORTANT: copyq's exact key for this varies by version — recent
; releases (>= 7.0) accept either `ignored_window_titles` or
; `Plugins\itemencrypted\password_window_titles`.  We set the legacy
; key and document the override path in _PROFILE.md.
ignored_window_titles=keepassxc;pinentry;Sign in;Sign Up;1Password;Bitwarden

[Theme]
; Use the system Plasma / GTK theme — no embedded fonts, no remote
; image fetches.
use_system_icons=true

[Options]
; "Run automatically when system starts" — we leave this OFF.  The user
; should opt into autostart explicitly via their session XDG file.
autostart=false
; Don't check for updates.  apt-managed.
check_for_updates=false
