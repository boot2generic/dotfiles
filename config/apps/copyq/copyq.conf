; config/apps/copyq/copyq.conf — clipboard manager baseline.
;
; CopyQ stores ALL clipboard content in plaintext under
; ~/.config/copyq/ by default, so anything copied — including KeePassXC
; passwords, GPG/SSH passphrases, OTP codes — lands in this file's
; sibling history DB the instant it hits the clipboard.
;
; KeePassXC's 10s clipboard auto-clear does NOT protect against this:
; CopyQ captures the value the moment you copy, well before the clear.
;
; There is NO reliable way to filter "only password-manager windows" in
; CopyQ: the documented `ignored_window_titles` key is NOT a real option
; (the running daemon rejects it as `Invalid option`), and the proper
; Command/window-title approach is unreliable on Wayland (KWin doesn't
; expose the source window title to the clipboard monitor).  A filter
; that silently fails is worse than no filter.
;
; So this profile takes the safe, bulletproof stance: DO NOT auto-store
; the clipboard at all.  No history is kept, so nothing can leak.  Copy
; and paste still work normally at the OS level — only CopyQ's history
; capture is off.  To use CopyQ as a history manager for non-sensitive
; content, flip check_clipboard back to true, but understand passwords
; WILL be captured if you do.
;
; CopyQ's INI keys are documented at https://hluk.github.io/CopyQ/.
; Verify any key against a running daemon with `copyq config <key>` —
; an `Invalid option` error means the key is a no-op.

[General]
; Do NOT monitor/store the clipboard or the X11 primary selection.
; This is the whole point of the profile: no capture => no leak, at the
; cost of no clipboard history.  Verified: with these false, copying a
; secret leaves `copyq count` at 0.
check_clipboard=false
check_selection=false
; Hard cap on clipboard history (only relevant if storing is re-enabled).
maxitems=200
; Re-edit history items with Ctrl+Return so accidental Enter doesn't
; clobber the clipboard.
edit_ctrl_return=true
; Don't auto-move-to-top on selection — keeps the order stable so muscle
; memory works after a few hours of use.
move=false
; Tray icon stays visible so the user has a one-glance "history is
; recording" signal.  Hiding the tray is a footgun.
disable_tray=false
; Open the clipboard dialog only on the configured global shortcut.
; Suppresses the "first-run welcome / what's new" overlay.
; (Correct key is `hide_main_window_in_task_bar` — note the underscore;
; the no-underscore spelling is rejected as an Invalid option.)
hide_main_window_in_task_bar=true

[Theme]
; Use the system Plasma / GTK theme — no embedded fonts, no remote
; image fetches.
use_system_icons=true

[Options]
; "Run automatically when system starts" — we leave this OFF.  The user
; should opt into autostart explicitly via their session XDG file.
autostart=false
; Don't check for updates.  apt-managed.
check_for_updates=false
