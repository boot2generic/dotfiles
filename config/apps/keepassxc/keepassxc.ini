; KeePassXC global preferences — privacy-by-default profile.
;
; Deployed by the apps-deploy pipeline to ${HOME}/.config/keepassxc/keepassxc.ini
; (mode 0600).  overlay=true → ~/.config/dotfiles-local/keepassxc/keepassxc.ini
; wins at apply time so a machine can layer local-only tweaks (e.g. enable
; browser integration on a workstation but not on the laptop) without diverging
; the repo.
;
; Only privacy-relevant knobs are set; everything else stays at upstream defaults
; so future KeePassXC versions add new features without us silently overriding.
;
; KDF parameters (Argon2id memory / iterations / parallelism) are stored INSIDE
; each .kdbx database, not in this ini.  Pick them at database-creation time
; via the GUI: Argon2id, ~2 GiB memory, ~5 transformations, 8 threads.  See
; _PROFILE.md for the full rationale.

[General]
RememberLastDatabases=false
OpenPreviousDatabasesOnStartup=false
MinimizeAfterUnlock=false

[GUI]
; KeePassXC's built-in updater would phone home to keepassxc.org every launch.
; apt manages the package on this system; let it.
CheckForUpdates=false
CheckForUpdatesIncludeBetas=false

[Security]
; Auto-lock the database after 5 minutes of user inactivity.
LockDatabaseIdle=true
LockDatabaseIdleSeconds=300
; Lock as soon as the KeePassXC window is minimised.
LockDatabaseMinimize=true
; Lock when the session locks (loginctl lock-session / xss-lock signal).
LockDatabaseScreenLock=true
; Clear the system clipboard 10 s after auto-fill so a password doesn't linger
; in xclip / wl-paste history after the user pastes once.
ClearClipboard=true
ClearClipboardTimeout=10
; Clear the in-app search box when the database locks.
ClearSearch=true
ClearSearchTimeout=5
; Don't fetch website favicons over the network — DNS leak vector.
IconDownloadFallback=false
; Always ask before triggering Auto-Type — prevents accidental injection into
; the wrong focused window (and the malicious-window variant of the same).
AutotypeAsk=true

[Browser]
; Browser integration ships OFF.  Turn on per-machine via overlay if you use
; the KeePassXC-Browser extension; otherwise the native-messaging host is an
; unnecessary attack surface (any process able to reach the unix socket can
; query the database).
Enabled=false

[SSHAgent]
; SSH agent integration ships OFF — same rationale as Browser.  Pairs nicely
; with `ssh-add ~/.ssh/id_ed25519` on demand instead.
Enabled=false
