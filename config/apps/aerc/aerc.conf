# config/apps/aerc/aerc.conf — privacy-first aerc baseline.
#
# Deployed to ~/.config/aerc/aerc.conf (mode 0644) by the dispatcher.
# accounts.conf is intentionally NOT shipped — it carries
# per-user / per-server credentials and is written by the user post-install.
#
# Knob rationale lives in config/apps/aerc/_PROFILE.md.

[ui]
# Mouse handling in a terminal mail client is a footgun — accidental click
# on a tracking pixel / blob can open it.  Keyboard-only by default.
mouse-enabled         = false
# Reduce the "this thing is alive" visual jitter while keeping a heartbeat.
spinner               = "[ ⠁ , ⠃ , ⠉ , ⠙ , ⠘ , ⠰ , ⠠ , ⠤ , ⠄ , ⠆ ]"
# Show the same column layout regardless of terminal width.
border-char-vertical  = "│"

[viewer]
# Less with -R passes through ANSI but does NOT render HTML — keeps the
# attack surface of weird MIME parts to a minimum.
pager                 = "less -R"
# Parse https:// / http:// links in plaintext bodies so the user can hit
# them with :open-link without manual selection.  No HTML.
parse-http-links      = true
# Show only the headers we actually care about in the viewer pane.
header-layout         = From,To,Cc,Subject,Date

[compose]
# Never silently bcc the sender — the user already gets a Sent copy via
# IMAP.  Avoids surprising disclosure if Mail-Followup-To collides.
no-bcc                = true
# Hold drafts locally instead of pushing to an IMAP Drafts folder while
# composing — protects in-flight mail from being indexed by server-side
# AI / spam tooling before the user is ready.
edit-headers          = false

[filters]
# Render HTML mail as plaintext via w3m — no JS, no remote images, no
# fonts.  text/calendar gets a similar treatment via aerc's built-in
# calendar filter when one is installed.
text/html             = w3m -T text/html -dump -cols 100
text/plain            = cat
image/*               = exit 0

[multipart-converters]
# Convert HTML alternatives to text before display so we never accidentally
# render markup with the system's default text/html handler.
text/plain            = w3m -T text/html -dump -cols 100

[hooks]
# No telemetry hooks.  No "phone home on first run" callout.  Add a hook
# under ~/.config/aerc/hooks/ if you want one.

[templates]
# Default reply template — quotes inline, signature stays at the end.
# Aerc reads this from $XDG_CONFIG_HOME/aerc/templates by default, so we
# leave the literal name here for documentation purposes.
quoted-reply          = "quoted_reply"
forwards              = "forward_as_body"
