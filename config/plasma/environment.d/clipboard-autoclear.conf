# Clipboard auto-clear timeout, in seconds.  Single source of truth for:
#   • ~/.config/plasma/clipboard-autoclear.sh — the watcher that wipes
#     the clipboard this many seconds after the last copy.
#   • ~/.config/conky/clipboard-status.sh — the conky readout that shows
#     the value and alerts if the watcher isn't running.
#
# pam_systemd imports ~/.config/environment.d/*.conf into the user
# session at graphical-session start, so this value reaches BOTH the
# autostart watcher and autostart conky uniformly (same mechanism as
# /etc/environment.d/95-nvidia-wayland.conf — see readme/plasma.md).
#
# CHANGING IT: edit the number, then log out and back in.  To apply
# without a full relogin:
#   systemctl --user set-environment CLIPBOARD_CLEAR_TIMEOUT=<seconds>
#   then restart the watcher (pkill -f 'clipboard-autoclear.sh --arm';
#   ~/.config/plasma/clipboard-autoclear.sh &)  and relaunch conky.
CLIPBOARD_CLEAR_TIMEOUT=30
