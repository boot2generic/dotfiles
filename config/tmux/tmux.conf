# ============================================================
# tmux Configuration — Cyberpunk Neon
# Deployed to: ~/.config/tmux/tmux.conf
# ============================================================

# ── Prefix ────────────────────────────────────────────────────
# Use tmux's default prefix (Ctrl-b).  No rebind — explicit `set -g prefix
# C-b` would also work but the default is already that.

# ── Core settings ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g status-interval 2

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Copy mode (vi keys) ───────────────────────────────────────
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Y   send-keys -X copy-end-of-line
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Splits ────────────────────────────────────────────────────
# Default tmux split bindings:
#   prefix + "   → split-window -v   (stacked, new pane below)
#   prefix + %   → split-window -h   (side-by-side, new pane right)
# We keep the defaults but override them so splits inherit the current
# pane's working directory (vanilla tmux opens the new pane in $HOME).
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window     -c "#{pane_current_path}"

# ── Pane navigation (vim-aware) ───────────────────────────────
# Forward Ctrl-h/j/k/l to the editor (instead of moving to the next
# tmux pane) when the focused pane is running an editor that has its
# OWN h/j/k/l split-navigation.  Recognised editors:
#   • vim, gvim, vimx, vimdiff, view (and the n* prefixed variants
#     for neovim: nvim, nvimx, nvimdiff, …)
#   • nvim-qt (Qt frontend for neovim — same bindings)
#   • helix / hx (modern Rust-based modal editor with vim-like splits)
# For anything else, Ctrl-hjkl moves between tmux panes as normal.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|nvim-qt|helix|hx)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize ───────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Rename ────────────────────────────────────────────────────
# prefix + r : rename pane title AND window tab in one prompt
bind r command-prompt -p "Rename:" "rename-window '%1' ; select-pane -T '%1'"
# prefix + W : rename window tab only (without affecting pane title)
bind W command-prompt -I "#W" "rename-window '%%'"

# ── Window navigation ─────────────────────────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window
bind Tab        last-window
bind b          choose-window

# ── Session management ────────────────────────────────────────
bind S  choose-session
bind N  new-session
bind '$' command-prompt -I "#S" "rename-session '%%'"

# ── File / path operations (fzf-powered) ─────────────────────
bind C-f run-shell "tmux neww bash -c '\
    file=\$(find \$HOME -type f -not -path \"*/.*\" 2>/dev/null \
        | fzf --preview=\"head -100 {}\" \
              --preview-window=right:60%:wrap \
              --prompt=\"Open file > \"); \
    [ -n \"\$file\" ] && \${EDITOR:-nvim} \"\$file\"'"

bind C-p run-shell "tmux neww bash -c '\
    path=\$(find \$HOME -not -path \"*/.*\" 2>/dev/null \
        | fzf --prompt=\"Copy path > \"); \
    [ -n \"\$path\" ] && tmux set-buffer \"\$path\" && tmux paste-buffer -t !'"

bind C-g run-shell "tmux neww bash -c '\
    result=\$(rg --line-number --no-heading --color=never \"\" \$HOME \
        --glob \"*.py\" --glob \"*.lua\" --glob \"*.sh\" --glob \"*.conf\" \
        --glob \"*.yaml\" --glob \"*.json\" --glob \"*.toml\" --glob \"*.rs\" \
        --glob \"*.c\" --glob \"*.cpp\" --glob \"*.php\" --glob \"*.html\" \
        2>/dev/null \
        | fzf --delimiter=: --nth=3.. \
              --preview=\"head -50 {1}\" \
              --prompt=\"Grep > \"); \
    file=\$(echo \"\$result\" | cut -d: -f1); \
    line=\$(echo \"\$result\" | cut -d: -f2); \
    [ -n \"\$file\" ] && \${EDITOR:-nvim} +\$line \"\$file\"'"

# ── Reload / misc ─────────────────────────────────────────────
bind R source-file ~/.config/tmux/tmux.conf \; display "  Config reloaded!"
bind x kill-pane
bind X kill-window
bind q display-panes

# ============================================================
# Cyberpunk Neon Theme — status bar at BOTTOM
# ============================================================

set -g status on
set -g status-position bottom
set -g status-justify left

# ── Base bar ─────────────────────────────────────────────────
set -g status-style "bg=#0d0d1a,fg=#e2e2ff"

# ── Left: session badge ───────────────────────────────────────
set -g status-left-length 40
set -g status-left "#[bg=#00e5ff,fg=#0d0d1a,bold]  #S #[bg=#0d0d1a,fg=#00e5ff]#[nobold]  "

# ── Right: pane title | host | date | time ────────────────────
set -g status-right-length 100
set -g status-right "#[fg=#5555aa]#{?pane_title,#[fg=#ff00cc] #{pane_title} #[fg=#5555aa]| ,}#[fg=#8888cc]#H#[fg=#5555aa] | #[fg=#8888cc]%a %b %d#[fg=#5555aa] | #[bg=#00e5ff,fg=#0d0d1a,bold] %H:%M "

# ── Window tabs ───────────────────────────────────────────────
setw -g window-status-format "#[bg=#0d0d1a,fg=#5555aa] #I#[fg=#8888cc]:#W "
setw -g window-status-current-format "#[bg=#1a1a2e,fg=#00e5ff,bold] #I#[fg=#e2e2ff]:#W#[fg=#00e5ff] ● "

setw -g window-status-current-style  "bg=#1a1a2e"
setw -g window-status-activity-style "fg=#ff00cc,bold"

# ── Pane borders ─────────────────────────────────────────────
set -g pane-border-style        "fg=#1a1a2e"
set -g pane-active-border-style "fg=#00e5ff"

# Pane title bar (shown when pane is renamed via prefix+r)
set -g pane-border-status       bottom
set -g pane-border-format       "#[fg=#00e5ff,bold] #{pane_index} #[fg=#8888cc]#{?pane_title,: #{pane_title},} "

# ── Message / command bar ─────────────────────────────────────
set -g message-style         "bg=#1a1a2e,fg=#00e5ff,bold"
set -g message-command-style "bg=#1a1a2e,fg=#ff00cc"

# ── Copy-mode highlight ───────────────────────────────────────
setw -g mode-style "bg=#1a1a2e,fg=#00e5ff"

# ── Clock (prefix + t) ───────────────────────────────────────
setw -g clock-mode-colour "#00e5ff"
setw -g clock-mode-style 24

# ============================================================
# Plugins (tpm)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @yank_selection       'clipboard'
set -g @yank_selection_mouse 'clipboard'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim         'session'

set -g @continuum-restore       'on'
set -g @continuum-save-interval '10'

# tmux-fzf is bound to prefix + F (capital).  Originally it was prefix +
# C-f, but that collides with our custom `bind C-f run-shell '...file
# picker...'` above — and tpm loads tmux-fzf AFTER our binds, so the
# plugin would silently override our file picker.  Using `F` keeps both
# accessible:
#   • prefix C-f → file picker (open file under ~ in $EDITOR)
#   • prefix F   → tmux-fzf menu (sessions / windows / panes / keys / …)
TMUX_FZF_LAUNCH_KEY="F"
TMUX_FZF_ORDER="session|window|pane|command|keybinding|clipboard|process"
TMUX_FZF_OPTIONS="-p 60%,40% --prompt='  tmux > '"

run '~/.tmux/plugins/tpm/tpm'
