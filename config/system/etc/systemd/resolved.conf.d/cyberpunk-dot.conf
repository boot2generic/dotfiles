# /etc/systemd/resolved.conf.d/cyberpunk-dot.conf
# Managed by ./local_setup.sh harden (`harden_dot`).  Hand-edits will be
# overwritten on the next `harden` run.  To remove cleanly, use:
#
#     ./local_setup.sh unharden    # restores the prior dhcpcd/NM-only DNS path
#
# Or hand-rollback:
#
#     sudo rm /etc/systemd/resolved.conf.d/cyberpunk-dot.conf
#     sudo rm /etc/NetworkManager/conf.d/cyberpunk-dns.conf
#     sudo systemctl disable --now systemd-resolved
#     sudo systemctl reload NetworkManager
#     # NM will rewrite /etc/resolv.conf on the next connection event;
#     # to force it: sudo nmcli connection up <your-connection>
#
# --- Why this file ---------------------------------------------------------
# Plain DNS (UDP/53) leaks the names of every host you visit to any passive
# observer on the LAN -- coffee-shop wifi, hotel APs, ISP middleboxes.  The
# query payloads are unencrypted and have no authenticity guarantees.  DoT
# wraps the same DNS protocol in TLS over TCP/853, which:
#   - encrypts the QNAME so an on-path observer can't read it,
#   - authenticates the resolver via its certificate (the `#hostname` syntax
#     below tells resolved which SNI to send and which cert CN/SAN to expect).
#
# --- Why opportunistic, not strict -----------------------------------------
# `DNSOverTLS=opportunistic` means: try DoT first, fall back to plain DNS if
# TCP/853 is blocked or the upstream cert doesn't validate.  This is the
# right default for a roaming laptop because:
#   - Captive portals (hotels, airports) often block TCP/853 outbound -- a
#     strict policy would leave you unable to resolve `captive.portal.com`
#     to even hit the login page.
#   - Some enterprise networks MITM all TLS, including DoT; opportunistic
#     mode degrades gracefully there too.
# Trade-off: a hostile network can DOWNGRADE you to plain DNS by RST-ing
# TCP/853.  The `check_dot()` indicator in conky/health.py surfaces this --
# if you're on a network you don't trust and the indicator shows "fallback",
# treat DNS as compromised (use Mullvad, run dig over the VPN, etc.).
#
# --- DNSSEC=allow-downgrade ------------------------------------------------
# Same rationale: validate DNSSEC signatures when the upstream supports it,
# but don't NXDOMAIN every lookup when it doesn't.  Yields real protection
# against cache-poisoning where the resolver is signed-zone-aware, and
# zero regression where it isn't.
#
# --- DNS server picks ------------------------------------------------------
# Cloudflare 1.1.1.1/1.0.0.1 (`cloudflare-dns.com`): fastest globally, very
#   solid DoT/DoH support, no-logging policy audited by KPMG.
# Quad9 9.9.9.9 (`dns.quad9.net`): blocks known-malicious domains at the
#   resolver (threat-intel feed), Swiss jurisdiction, no logging.
# Multiple servers because resolved round-robins on failure and we want
#   the system to keep working if one provider has an outage.
#
# FallbackDNS: Google 8.8.8.8 is intentionally plain (no `#hostname` suffix).
#   This kicks in only when ALL primary servers fail, e.g. a hostile network
#   that's blocking Cloudflare/Quad9 specifically.  We're explicitly trading
#   privacy for liveness here -- if you'd rather hard-fail in that case,
#   remove the FallbackDNS line.
#
# --- Per-host overrides ----------------------------------------------------
# If ~/.config/dotfiles-local/etc/systemd/resolved.conf.d/cyberpunk-dot.conf
# exists, harden_dot() deploys IT instead of this file.  Useful for hosts
# that need a specific corporate resolver, or for testing.

[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net
FallbackDNS=8.8.8.8 8.8.4.4
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
Cache=yes
DNSStubListener=yes
