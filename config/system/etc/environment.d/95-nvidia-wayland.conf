# /etc/environment.d/95-nvidia-wayland.conf
# Managed by ./local_setup.sh (deploy_nvidia_wayland_env).  Hand-edits
# will be overwritten on the next `deploy` run.  To DISABLE these
# overrides entirely:
#
#     sudo rm /etc/environment.d/95-nvidia-wayland.conf
#     # then log out + log back in (these are read by pam_systemd at
#     # session start; a fresh shell in an existing session won't pick
#     # the removal up until the next graphical-session.target).
#
# WHY /etc/environment.d/ and NOT /etc/environment?
#   • /etc/environment is read by pam_env, NOT by every user app — only
#     login(1)/sshd-launched shells see it.  GNOME / KDE / SDDM-started
#     Wayland sessions go through pam_systemd, which sources
#     /etc/environment.d/*.conf at session start (see environment.d(5)).
#   • The "95-" numeric prefix orders this AFTER systemd's own defaults
#     (00-..-90-..) but BEFORE any host-specific 99-* drop-in.
#
# Each variable below has a paragraph explaining what it does and why
# it's set.  Future-you debugging a Wayland glitch in six months: start
# by removing one variable at a time and reproducing.
#
# --- VRR / G-Sync -----------------------------------------------------
# Allow the NVIDIA driver to engage G-Sync on supported monitors when
# the Wayland compositor (KWin) negotiates a variable refresh rate.
# Without this the driver leaves G-Sync OFF even on a G-Sync-certified
# panel, and you'll see screen tear + judder on anything below 240 Hz
# on the desktop's 3-monitor setup.  Harmless on non-G-Sync displays.
__GL_GSYNC_ALLOWED=1

# Same idea, broader: lets the driver expose ANY VRR-capable mode (Adap-
# tive-Sync / FreeSync-over-HDMI / G-Sync Compatible), not just true
# G-Sync.  Required for the FreeSync-branded panels in the desktop's
# multi-monitor mix; redundant on pure-G-Sync setups but harmless.
__GL_VRR_ALLOWED=1

# --- KWin / wlroots cursor-flicker workaround -------------------------
# Forces the compositor to render the mouse cursor as a regular GL
# surface instead of a hardware cursor plane.  Works around a long-
# standing NVIDIA bug where the HW cursor plane flickers / disappears
# on Plasma 6 Wayland (visible as a missing cursor when dragging across
# monitor boundaries, or a black square trail on overview animations).
#
# Status: largely fixed in NVIDIA 565+.  We leave the override ON
# because (a) it's cheap — a few hundred microseconds per frame at
# 1440p/240Hz, well under budget on a 3080 Ti — and (b) regressions
# have shipped in newer drivers more than once.  To test if you can
# remove it: comment this line out, log out + back in, and use the
# overview / a multi-monitor drag for an hour.  If the cursor stays
# put, you don't need it anymore.
#
# Despite the WLR_ prefix (wlroots), KWin honours this var too via the
# compositor-shared cursor path.
WLR_NO_HARDWARE_CURSORS=1

# --- Firefox on Wayland ----------------------------------------------
# Tell Firefox to use its native Wayland backend instead of XWayland.
# Debian Trixie's Firefox ESR defaults to XWayland for compatibility;
# on Plasma 6 + NVIDIA this means an extra GL copy through the X11
# server, which is exactly what we don't want at 1440p/240Hz.  Setting
# this gives Firefox direct dma-buf scanout and HW video decode via
# nvidia-vaapi-driver.
MOZ_ENABLE_WAYLAND=1
