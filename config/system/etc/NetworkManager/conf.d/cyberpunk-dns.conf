# /etc/NetworkManager/conf.d/cyberpunk-dns.conf
# Managed by ./local_setup.sh harden (`harden_dot`).  Removing this file
# (via `./local_setup.sh unharden` or by hand) reverts NM to its default
# behaviour of writing /etc/resolv.conf directly.
#
# --- Why this file ---------------------------------------------------------
# By default on Debian, NetworkManager owns /etc/resolv.conf and rewrites
# it on every connection event, dropping in the DHCP-supplied nameservers
# verbatim.  If we just point /etc/resolv.conf at systemd-resolved's stub
# (127.0.0.53) without telling NM to back off, NM will RACE us on the next
# connection event and overwrite our symlink -- DNS-over-TLS effectively
# disabled the next time the wifi blips.
#
# `dns=systemd-resolved` flips NM into "push DNS to resolved, don't touch
# /etc/resolv.conf" mode.  NM keeps providing per-connection nameservers
# (DHCP, VPN, manual entries) -- it just hands them to resolved via the
# org.freedesktop.resolve1 D-Bus API instead of writing them to disk.
# Resolved layers them on top of the global DNS= list in
# /etc/systemd/resolved.conf.d/cyberpunk-dot.conf, so per-link DNS for
# corporate VPNs etc. still works.
#
# This drop-in is in conf.d/ (not the main NetworkManager.conf) so an
# `apt-get install --reinstall network-manager` won't clobber it.

[main]
dns=systemd-resolved
