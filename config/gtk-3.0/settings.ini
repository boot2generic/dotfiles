# ============================================================
# GTK 3 Settings
# Dark theme with Papirus icons — matches Catppuccin Mocha feel
# ============================================================

[Settings]
# Widget theme: use a dark Adwaita variant as a reliable default;
# install arc-theme or catppuccin-gtk for a tighter color match
gtk-theme-name        = Adwaita-dark
gtk-icon-theme-name   = Papirus-Dark
gtk-cursor-theme-name = Adwaita
gtk-cursor-theme-size = 24

# Font for GTK applications
gtk-font-name         = JetBrains Mono 10

# Prefer dark color scheme (GTK 4 / libadwaita hint)
gtk-application-prefer-dark-theme = 1

# Disable event sounds (change to 1 if audio feedback is wanted)
gtk-enable-event-sounds         = 0
gtk-enable-input-feedback-sounds = 0

# Toolbar style: icons only for a clean look
gtk-toolbar-style    = GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size = GTK_ICON_SIZE_SMALL_TOOLBAR

# Menu behavior
gtk-menu-images         = 1
gtk-button-images       = 0
gtk-can-change-accels   = 0
gtk-show-input-method-menu = 1
gtk-show-unicode-menu   = 1

# Scrollbar: hide thin scrollbars until hovered
gtk-overlay-scrolling = 1

# Decoration layout: buttons on the right
gtk-decoration-layout = :minimize,maximize,close
