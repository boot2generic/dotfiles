# /etc/sddm.conf.d/10-wayland.conf
#
# Deployed by local_setup.sh (--desktop=plasma path) into
# /etc/sddm.conf.d/ as root-owned 0644.  Uses Debian's stock Breeze
# SDDM theme.
#
# DisplayServer is intentionally NOT pinned to wayland here.  SDDM's
# default greeter backend (x11) works on every hypervisor including
# VirtualBox/VBoxVGA and older Hyper-V configs without good KMS.
# Both wayland-sessions/ and xsessions/ are listed below, so the user
# picks "Plasma (Wayland)" or "Plasma (X11)" from the session dropdown
# at the greeter — SDDM remembers their choice per-user thereafter:
#   • NVIDIA desktop + multi-monitor + 240Hz → pick Wayland
#   • Intel/AMD laptop on bare metal           → pick Wayland
#   • Hyper-V / VMware / KVM VM                → either works; Wayland
#                                                 if KMS is good
#   • VirtualBox with default VBoxVGA          → pick X11 (no KMS)
#
# Custom Cyberpunk SDDM theming is intentionally out of scope for v1 —
# the greeter is on screen for ~5 seconds.  If desired later, copy
# /usr/share/sddm/themes/breeze to a new theme dir, edit theme.conf,
# and update Current= below.

[Theme]
Current=breeze
CursorTheme=breeze_cursors
Font=JetBrains Mono

[Wayland]
SessionDir=/usr/share/wayland-sessions
EnableHiDPI=true

[X11]
SessionDir=/usr/share/xsessions
EnableHiDPI=true
