; ============================================================
; Polybar Configuration
; Theme: Cyberpunk Neon
; ============================================================

[settings]
screenchange-reload = true
pseudo-transparency = false

; ============================================================
; Colors — Cyberpunk Neon
; ============================================================
[colors]
bg        = #0d0d1a
bg_dark   = #080810
surface   = #12121f
surface1  = #1a1a2e
surface2  = #16213e
text      = #e2e2ff
subtext   = #8888cc
overlay   = #5555aa
cyan      = #00e5ff
magenta   = #ff00cc
green     = #00ff41
yellow    = #ffcc00
orange    = #ff6b35
red       = #ff0055
purple    = #9900ff

; ============================================================
; Bar
; ============================================================
[bar/main]
monitor =
width   = 100%
height  = 32
top     = true

padding-left  = 1
padding-right = 1
module-margin = 1

background = ${colors.bg}
foreground = ${colors.text}

; Thin neon cyan accent line at the bottom of the bar
border-bottom-size  = 2
border-bottom-color = ${colors.cyan}

; JetBrainsMono Nerd Font covers all glyphs (text + icons)
font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;3
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;3
font-2 = JetBrainsMono Nerd Font Mono:style=Regular:size=13;4

modules-left   = i3 xwindow
modules-center = date
modules-right  = cpu memory eth wlan sep mullvad wireguard sep pulseaudio battery tray

scroll-up   = i3.prev
scroll-down = i3.next
enable-ipc  = true

; ============================================================
; Module: i3 workspaces
; ============================================================
[module/i3]
type = internal/i3
pin-workspaces  = true
index-sort      = true
wrapping-scroll = false

; Focused — electric cyan with underline
label-focused            = %index%
label-focused-foreground = ${colors.cyan}
label-focused-background = ${colors.surface1}
label-focused-underline  = ${colors.cyan}
label-focused-padding    = 2

; Occupied — matrix green
label-occupied            = %index%
label-occupied-foreground = ${colors.green}
label-occupied-padding    = 2

; Urgent — hot red
label-urgent            = %index%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.bg_dark}
label-urgent-underline  = ${colors.red}
label-urgent-padding    = 2

; Empty — dim overlay
label-empty            = %index%
label-empty-foreground = ${colors.overlay}
label-empty-padding    = 2

; ============================================================
; Module: Active window title
; ============================================================
[module/xwindow]
type             = internal/xwindow
label            = %title:0:60:...%
label-foreground = ${colors.subtext}

; ============================================================
; Module: Date/Time
; ============================================================
[module/date]
type     = internal/date
interval = 1

date     = " %a %b %d"
time     = " %H:%M"
date-alt = " %A, %B %d %Y"
time-alt = " %H:%M:%S"

label            = %date%  %time%
label-foreground = ${colors.text}

; ============================================================
; Module: CPU
; ============================================================
[module/cpu]
type     = internal/cpu
interval = 2

format-prefix            = " "
format-prefix-foreground = ${colors.cyan}

label            = %percentage:2%%
label-foreground = ${colors.text}

; ============================================================
; Module: Memory
; ============================================================
[module/memory]
type     = internal/memory
interval = 2

format-prefix            = " "
format-prefix-foreground = ${colors.magenta}

label            = %percentage_used:2%%
label-foreground = ${colors.text}

; ============================================================
; Module: Ethernet
; ============================================================
; Hidden when no wired link is up so the bar doesn't permanently
; carry a red "offline" pill on a laptop running on wifi.  Click
; opens nm-connection-editor for full GUI management.
[module/eth]
type           = internal/network
interface-type = wired
interval       = 3

format-connected            = <label-connected>
label-connected             = " %downspeed:7%  %upspeed:7%"
label-connected-foreground  = ${colors.green}

; Empty disconnected format = module renders nothing → eats no space.
format-disconnected =

click-left = nm-connection-editor

; ============================================================
; Module: Wireless
; ============================================================
; Signal-strength ramp + SSID + throughput.  Disconnected state
; shows the wifi-off icon so the user can see at a glance whether
; rfkill or NetworkManager has the radio down.
;
; Click bindings:
;   left   → wifi-menu.sh           (rofi: scan + connect + details)
;   right  → nm-connection-editor    (full GUI for VPN profiles, certs)
;   middle → rfkill toggle wifi     (XF86WLAN-equivalent)
[module/wlan]
type           = internal/network
interface-type = wireless
interval       = 3

format-connected            = <ramp-signal> <label-connected>
label-connected             = "%essid:0:14:…% %downspeed:6%"
label-connected-foreground  = ${colors.cyan}

ramp-signal-0            = 󰤯
ramp-signal-1            = 󰤟
ramp-signal-2            = 󰤢
ramp-signal-3            = 󰤥
ramp-signal-4            = 󰤨
ramp-signal-0-foreground = ${colors.red}
ramp-signal-1-foreground = ${colors.orange}
ramp-signal-2-foreground = ${colors.yellow}
ramp-signal-3-foreground = ${colors.cyan}
ramp-signal-4-foreground = ${colors.cyan}

format-disconnected            = <label-disconnected>
label-disconnected             = "󰤮 off"
label-disconnected-foreground  = ${colors.overlay}

click-left   = ~/.config/polybar/scripts/wifi-menu.sh
click-right  = nm-connection-editor
click-middle = sh -c '/usr/sbin/rfkill toggle wifi'

; ============================================================
; Module: PulseAudio volume
; ============================================================
; Click-left toggles mute, scroll-up/down adjusts volume by 5 %,
; click-right opens the full mixer.  We set these explicitly rather
; than relying on polybar's defaults, which have varied across versions.
[module/pulseaudio]
type       = internal/pulseaudio
use-ui-max = false
interval   = 2

format-volume            = <ramp-volume> <label-volume>
label-volume             = %percentage%%
label-volume-foreground  = ${colors.text}

label-muted            = " muted"
label-muted-foreground = ${colors.overlay}

ramp-volume-0 = ""
ramp-volume-1 = ""
ramp-volume-2 = ""
ramp-volume-0-foreground = ${colors.overlay}
ramp-volume-1-foreground = ${colors.yellow}
ramp-volume-2-foreground = ${colors.cyan}

; Mouse actions — # prefix invokes a polybar-internal action.
click-left  = pulseaudio.toggle
scroll-up   = pulseaudio.inc
scroll-down = pulseaudio.dec
click-right = pavucontrol

; ============================================================
; Module: Battery
; ============================================================
; Custom-script implementation (see scripts/battery.sh).  Reasons for
; choosing custom/script over internal/battery:
;   - Auto-detects BAT0/BAT1 — internal/battery hardcodes one name
;     and silently shows 0% on hardware that uses a different one
;     (most newer X1 / dual-battery ThinkPads).
;   - Surfaces time-remaining ("78% (02:31)") via `acpi -b`, which
;     internal/battery's %time% only shows while discharging.
;   - Renders nothing at all on machines without /sys/class/power_supply
;     (desktops / VMs), so the bar slot collapses cleanly.
;
; Click — left: ACPI summary in alacritty (battery + thermal + AC).
;         right: full tlp-stat battery-health report (sudo).
[module/battery]
type     = custom/script
exec     = ~/.config/polybar/scripts/battery.sh
interval = 10
click-left  = alacritty --hold -e acpi -V
click-right = alacritty --hold -e sudo tlp-stat -b

; ============================================================
; Module: Separator
; ============================================================
[module/sep]
type   = custom/text
format = "|"
format-foreground = ${colors.surface1}

; ============================================================
; Module: Mullvad VPN
; ============================================================
; Status text (icon + relay-or-state) is generated by the helper script.
; The script handles its own colours via polybar's %{F…} escapes, so we
; don't set foreground here.  Click bindings:
;   left  → toggle  (connect / disconnect)
;   right → menu    (rofi: relay picker, settings, account, GUI)
[module/mullvad]
type        = custom/script
exec        = ~/.config/polybar/scripts/mullvad-status.sh
interval    = 3
click-left  = ~/.config/polybar/scripts/mullvad-toggle.sh
click-right = ~/.config/polybar/scripts/mullvad-menu.sh

; ============================================================
; Module: WireGuard tunnel
; ============================================================
; Hidden (empty exec output) when no wg interface is up; shows
; "<iface> → <endpoint>" otherwise.  Click brings up rofi menu listing
; every /etc/wireguard/*.conf file with up/down toggle per entry.
[module/wireguard]
type        = custom/script
exec        = ~/.config/polybar/scripts/wireguard-status.sh
interval    = 5
click-left  = ~/.config/polybar/scripts/wireguard-menu.sh

; ============================================================
; Module: System tray
; ============================================================
[module/tray]
type            = internal/tray
tray-spacing    = 4
tray-background = ${colors.bg}
tray-foreground = ${colors.text}
