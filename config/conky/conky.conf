-- ============================================================
-- Conky — Cyberpunk Hardware Monitor
-- Deployed to: ~/.config/conky/conky.conf
-- ============================================================

conky.config = {
    -- Display
    alignment          = 'top_right',
    gap_x              = 16,
    gap_y              = 40,
    -- Width chosen so the CONNECTIONS row (proto + dir + :port + remote
    -- + ↑/↓ rates + process name) fits without clipping.  Earlier we
    -- shipped 310 px which truncated `systemd-resolved` to
    -- `systemd-reso` even though there was room on the screen.
    minimum_width      = 460,
    maximum_width      = 460,

    -- Window — true ARGB transparency (background shows through)
    --
    -- own_window_type is patched at deploy time by local_setup.sh's
    -- patch_conky_window_type():
    --   • i3 (X11)        → 'override' (override-redirect; WM ignores)
    --   • plasma/Wayland  → 'normal'   (managed; KWin window rule in
    --                                   config/plasma/kwinrulesrc keeps
    --                                   it below + skip-taskbar/pager/
    --                                   switcher + no border)
    --
    -- Why not just keep 'override' on plasma: under XWayland, KWin
    -- treats X override-redirect surfaces as transient popups and
    -- hands them no stacking layer, so plasmashell's desktop layer
    -- ends up drawn over conky and the window vanishes (process keeps
    -- running, you see it in `ps`).  'desktop' was tried previously
    -- and had the same disappear-under-wallpaper failure mode.  A
    -- managed 'normal' window with an enforced KWin rule is the only
    -- combination that both i3 (with the runtime sed back to
    -- 'override') and plasma+wayland render correctly.
    own_window         = true,
    own_window_type    = 'override',
    own_window_class   = 'Conky',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value  = 175,      -- 0=fully transparent, 255=opaque
    own_window_colour  = '080810',
    own_window_hints   = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- No border / frame
    draw_borders       = false,
    draw_graph_borders = false,
    border_width       = 0,

    -- Font
    use_xft            = true,
    font               = 'JetBrains Mono:size=8',
    xftalpha           = 1,
    override_utf8_locale = true,

    -- Update interval (seconds).  5 s now — even with picom's
    -- fade-exclude + opacity-rule pinning Conky at 100%, every
    -- repaint on Hyper-V xrender (use-damage=false) costs a full-
    -- screen blit.  5 s is plenty fast for live CPU / RAM / net
    -- numbers and noticeably reduces background paint pressure.
    update_interval    = 5,
    cpu_avg_samples    = 3,
    net_avg_samples    = 2,

    -- Behaviour
    double_buffer      = true,
    no_buffers         = true,
    out_to_console     = false,
    out_to_stderr      = false,
    extra_newline      = false,

    -- Colors
    default_color      = 'e2e2ff',
    color0             = '00e5ff',   -- cyan  (headers)
    color1             = 'ff00cc',   -- magenta (highlights)
    color2             = '00ff41',   -- green  (ok values)
    color3             = 'ffcc00',   -- yellow (warnings)
    color4             = '5555aa',   -- dim    (labels)
    color5             = 'ff0055',   -- red    (critical)
    color6             = '9900ff',   -- purple (accents)
}

conky.text = [[
${color0}${font JetBrains Mono:bold:size=9}  SYSTEM${font}${color}
${color4}──────────────────────────────${color}
${color4}Host   ${color}${nodename}
${color4}OS     ${color}${distribution} ${kernel}
${color4}Uptime ${color}${uptime_short}
${color4}Load   ${color}${loadavg 1} ${loadavg 2} ${loadavg 3}
${if_existing /sys/class/thermal/thermal_zone0/temp}${color4}CPU°C  ${color}${execpi 8 sensors 2>/dev/null | grep -E 'Tctl|Tdie|Package id 0|Core 0' | head -1 | grep -oP '[+-][0-9]+\.[0-9]+°C' | head -1}${endif}

${color0}${font JetBrains Mono:bold:size=9}  HEALTH${font}${color}
${color4}──────────────────────────────${color}
${execpi 30 python3 ~/.config/conky/health.py}

${color0}${font JetBrains Mono:bold:size=9}  CLIPBOARD${font}${color}
${color4}──────────────────────────────${color}
${execpi 10 sh ~/.config/conky/clipboard-status.sh}

${if_existing /proc/driver/nvidia/version}${color0}${font JetBrains Mono:bold:size=9}  GPU${font}${color}
${color4}──────────────────────────────${color}
${endif}${execpi 5 python3 ~/.config/conky/gpu.py}
${color0}${font JetBrains Mono:bold:size=9}  DISK${font}${color}
${color4}──────────────────────────────${color}
${color4}/      ${color}${fs_used /} / ${fs_size /}  (${fs_used_perc /}%)
${color2}${fs_bar 4,210 /}${color}
${if_mounted /home}${color4}/home  ${color}${fs_used /home} / ${fs_size /home}  (${fs_used_perc /home}%)
${color2}${fs_bar 4,210 /home}${color}
${endif}${color4}I/O    ${color}▲ ${diskio_write}/s  ▼ ${diskio_read}/s

${color0}${font JetBrains Mono:bold:size=9}  NETWORK${font}${color}
${color4}──────────────────────────────${color}
${execpi 5 python3 ~/.config/conky/network.py}
${color0}${font JetBrains Mono:bold:size=9}  LISTENING PORTS${font}${color}
${color4}──────────────────────────────${color}
${color4}  PRO  :PORT   PROCESS${color}
${color2}${execpi 9 python3 ~/.config/conky/listenports.py}${color}

${color0}${font JetBrains Mono:bold:size=9}  CONNECTIONS${font}${color}
${color4}──────────────────────────────${color}
${color4}  ★=new  ∞=long  ⚠=long+public  ⏱=beacon${color}
${color4}   PRO  DIR    :PORT   REMOTE             ↑BW/s    ↓BW/s    AGE PROC${color}
${color2}${execpi 6 python3 ~/.config/conky/netstat.py}${color}
]]
-- Removed: standalone TIME block (polybar shows the clock top-centre),
-- CPU section (moved to polybar), MEMORY section (moved to polybar),
-- NEW PROCESSES + TOP PROCESSES (the CONNECTIONS list now expands into
-- the freed space — see netstat.py MAX_SHOW).
-- Added: HEALTH (anomaly indicators via health.py) and conditional
-- GPU section (only renders when nvidia driver is loaded).
-- NETWORK now auto-detects the default-route interface via
-- `ip -o -4 route show default` so it works on any naming scheme
-- (eth0, ens3, enp4s0, wlp3s0, …).
