-- ============================================================
-- Conky — Cyberpunk Hardware Monitor
-- Deployed to: ~/.config/conky/conky.conf
-- ============================================================

conky.config = {
    -- Display
    alignment          = 'top_right',
    gap_x              = 16,
    gap_y              = 40,
    -- Width chosen so the CONNECTIONS row (proto + dir + :port + remote
    -- + ↑/↓ rates + process name) fits without clipping.  Earlier we
    -- shipped 310 px which truncated `systemd-resolved` to
    -- `systemd-reso` even though there was room on the screen.
    minimum_width      = 460,
    maximum_width      = 460,

    -- Window — true ARGB transparency (background shows through)
    --
    -- 'override' is what kept conky on the desktop layer for the entire
    -- history of this repo.  Override-redirect makes the WM ignore the
    -- window — it never enters i3's tiling, never gets raised when the
    -- user opens a new app, and never participates in stacking events
    -- that would push it on top.  We briefly switched to 'desktop' to
    -- chase a flicker symptom; that broke the stacking (i3 doesn't
    -- actively lower desktop-type windows, so every newly-mapped app
    -- ended up above conky).  The flicker root cause was actually in
    -- picom (fading + opacity-rule fights) and is fixed there now —
    -- see config/picom/picom.conf fade-exclude / opacity-rule for Conky.
    own_window         = true,
    own_window_type    = 'override',
    own_window_class   = 'Conky',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value  = 175,      -- 0=fully transparent, 255=opaque
    own_window_colour  = '080810',
    own_window_hints   = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- No border / frame
    draw_borders       = false,
    draw_graph_borders = false,
    border_width       = 0,

    -- Font
    use_xft            = true,
    font               = 'JetBrains Mono:size=8',
    xftalpha           = 1,
    override_utf8_locale = true,

    -- Update interval (seconds).  5 s now — even with picom's
    -- fade-exclude + opacity-rule pinning Conky at 100%, every
    -- repaint on Hyper-V xrender (use-damage=false) costs a full-
    -- screen blit.  5 s is plenty fast for live CPU / RAM / net
    -- numbers and noticeably reduces background paint pressure.
    update_interval    = 5,
    cpu_avg_samples    = 3,
    net_avg_samples    = 2,

    -- Behaviour
    double_buffer      = true,
    no_buffers         = true,
    out_to_console     = false,
    out_to_stderr      = false,
    extra_newline      = false,

    -- Colors
    default_color      = 'e2e2ff',
    color0             = '00e5ff',   -- cyan  (headers)
    color1             = 'ff00cc',   -- magenta (highlights)
    color2             = '00ff41',   -- green  (ok values)
    color3             = 'ffcc00',   -- yellow (warnings)
    color4             = '5555aa',   -- dim    (labels)
    color5             = 'ff0055',   -- red    (critical)
    color6             = '9900ff',   -- purple (accents)
}

conky.text = [[
${color0}${font JetBrains Mono:bold:size=9}  SYSTEM${font}${color}
${color4}──────────────────────────────${color}
${color4}Host   ${color}${nodename}
${color4}OS     ${color}${distribution} ${kernel}
${color4}Uptime ${color}${uptime_short}

${color0}${font JetBrains Mono:bold:size=9}  CPU${font}${color}
${color4}──────────────────────────────${color}
${color4}Model  ${color}${exec grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | sed 's/^ *//' | cut -c1-28}
${color4}Usage  ${color}${cpu cpu0}% ${color1}${cpubar cpu0 6,210}${color}
${color4}Freq   ${color}${freq_g} GHz
${if_existing /sys/class/thermal/thermal_zone0/temp}${color4}Temp   ${color}${execpi 4 sensors 2>/dev/null | grep -E 'Core 0|Package id 0|temp1' | head -1 | grep -oP '[0-9]+\.[0-9]+' | head -1}°C
${endif}
${color0}${font JetBrains Mono:bold:size=9}  MEMORY${font}${color}
${color4}──────────────────────────────${color}
${color4}RAM    ${color}${mem} / ${memmax}
${color4}Used   ${color}${memperc}% ${color1}${membar 6,210}${color}
${color4}Swap   ${color}${swap} / ${swapmax} (${swapperc}%)

${color0}${font JetBrains Mono:bold:size=9}  DISK${font}${color}
${color4}──────────────────────────────${color}
${color4}/      ${color}${fs_used /} / ${fs_size /}
${color4}Used   ${color}${fs_used_perc /}% ${color2}${fs_bar 6,210 /}${color}
${color4}Read   ${color}${diskio_read}/s   ${color4}Write ${color}${diskio_write}/s

${color0}${font JetBrains Mono:bold:size=9}  NETWORK${font}${color}
${color4}──────────────────────────────${color}
${if_existing /sys/class/net/eth0/operstate}${color4}eth0   ${color}${addr eth0}
${color4}  ▲ ${color}${upspeed eth0}/s  ${color4}▼ ${color}${downspeed eth0}/s
${color2}${upspeedgraph eth0 16,150 00ff41 00e5ff}${color}
${color1}${downspeedgraph eth0 16,150 ff00cc 9900ff}${color}
${endif}${if_existing /sys/class/net/ens3/operstate}${color4}ens3   ${color}${addr ens3}
${color4}  ▲ ${color}${upspeed ens3}/s  ${color4}▼ ${color}${downspeed ens3}/s
${color2}${upspeedgraph ens3 16,150 00ff41 00e5ff}${color}
${color1}${downspeedgraph ens3 16,150 ff00cc 9900ff}${color}
${endif}${if_existing /sys/class/net/enp0s3/operstate}${color4}enp0s3 ${color}${addr enp0s3}
${color4}  ▲ ${color}${upspeed enp0s3}/s  ${color4}▼ ${color}${downspeed enp0s3}/s
${color2}${upspeedgraph enp0s3 16,150 00ff41 00e5ff}${color}
${color1}${downspeedgraph enp0s3 16,150 ff00cc 9900ff}${color}
${endif}
${color0}${font JetBrains Mono:bold:size=9}  LISTENING PORTS${font}${color}
${color4}──────────────────────────────${color}
${color4}  PRO  :PORT   PROCESS${color}
${color2}${execpi 9 python3 ~/.config/conky/listenports.py}${color}

${color0}${font JetBrains Mono:bold:size=9}  CONNECTIONS${font}${color}
${color4}──────────────────────────────${color}
${color4}  PRO  DIR    :PORT   REMOTE             ↑BW/s     ↓BW/s     PROC${color}
${color2}${execpi 6 python3 ~/.config/conky/netstat.py}${color}

${color0}${font JetBrains Mono:bold:size=9}  NEW PROCESSES${font}${color}
${color4}──────────────────────────────${color}
${color2}${execpi 6 python3 ~/.config/conky/newprocs.py}${color}

${color0}${font JetBrains Mono:bold:size=9}  TOP PROCESSES${font}${color}
${color4}──────────────────────────────${color}
${color4}NAME             CPU%  MEM%${color}
${color2}${top name 1}${top cpu 1}%  ${top mem 1}%${color}
${color}${top name 2}${top cpu 2}%  ${top mem 2}%
${color4}${top name 3}${top cpu 3}%  ${top mem 3}%${color}
${color4}${top name 4}${top cpu 4}%  ${top mem 4}%${color}
${color4}${top name 5}${top cpu 5}%  ${top mem 5}%${color}
]]
-- The standalone TIME block was removed: polybar already shows the
-- clock top-centre, so this conky panel was duplicating the same data.
