# ============================================================
# Picom Compositor Configuration
# Fixed for Hyper-V (no DRI2): uses xrender backend
#
# Wayland note: picom is X11-only.  On a Wayland session the compositor
# (sway, hyprland, gnome-shell, kwin) does its own compositing and
# this file is irrelevant.  These dotfiles target X11 + i3, so picom
# is unconditionally launched from i3's autostart.
# ============================================================

# ============================================================
# Backend — xrender works without GPU/DRI2 (safe for Hyper-V).
# This file ships with `xrender` so first-launch in a VM is safe;
# local_setup.sh's patch_picom_backend() rewrites it to "glx" on
# physical machines with a real GPU.  Re-running deploy_phase
# re-applies that patch automatically.
# ============================================================
backend     = "xrender";
vsync       = true;
use-damage  = false;   # set true only with glx

# ============================================================
# Shadows
# ============================================================
shadow          = true;
shadow-radius   = 10;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity  = 0.6;

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@"
];

# ============================================================
# Fading transitions
# ============================================================
fading       = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta   = 5;

# Skip fades for windows that don't benefit from them and
# previously caused visible flicker.  conky redraws every few
# seconds and would re-trigger a fade animation each time on the
# whole desktop layer; polybar is similar; dunst notifications
# already have their own fade timing.
fade-exclude = [
    "class_g = 'Conky'",
    "class_g = 'Polybar'",
    "name = 'Notification'",
    "class_g ?= 'Notify-osd'"
];

# ============================================================
# Transparency / opacity
# ============================================================
active-opacity   = 1.0;
inactive-opacity = 0.92;
frame-opacity    = 0.9;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "95:class_g  = 'Alacritty'",
    "100:class_g = 'Rofi'",
    "100:fullscreen_state = 1",
    # Pin Conky and Polybar at 100% — without this, picom's
    # `inactive-opacity = 0.92` fades them to 92% on every focus
    # change, and on Hyper-V's xrender (use-damage=false) that
    # triggers a full-screen repaint that registers as visible
    # flicker.
    "100:class_g = 'Conky'",
    "100:class_g = 'Polybar'"
];

focus-exclude = [
    "class_g = 'Cairo-clock'"
];

# ============================================================
# Rounded corners
# ============================================================
corner-radius = 10;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
];

# ============================================================
# General
# ============================================================
mark-wmwin-focused     = true;
mark-ovredir-focused   = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
use-ewmh-active-win    = true;
detect-transient       = true;
detect-client-leader   = true;
log-level              = "warn";

wintypes:
{
    tooltip      = { fade = true; shadow = true; opacity = 0.9; focus = true; };
    dock         = { shadow = false; };
    dnd          = { shadow = false; };
    popup_menu   = { opacity = 1.0; shadow = true; };
    dropdown_menu = { opacity = 1.0; shadow = true; };
    # `desktop` covers conky's override-redirect window.  Without an
    # explicit rule here, picom applied default fade + shadow on
    # every redraw, causing the visible flicker.  These four lines
    # turn off everything visual about it AS FAR AS PICOM IS
    # CONCERNED — conky still draws its own ARGB content; picom
    # just stops fighting it.
    desktop      = { fade = false; shadow = false; opacity = 1; focus = false; };
};
